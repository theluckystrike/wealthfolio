id: EDGE-MIX-03
title: An internal transfer into a holdings account nets off its inferred flow
intent: >
  acc-a sends 100 cash to acc-h (HOLDINGS) on 01-03, a paired transfer
  inside the portfolio. acc-h's snapshots go from 100 to 150 cash, so the
  owner also took 50 out. acc-h's flow is one net movement inferred from its
  snapshots (+50); the transfer's 100 comes off that net, leaving the 50
  withdrawal, whichever side it falls on.
policy: { base_currency: USD, timezone: UTC, as_of: 2025-01-04 }
accounts:
  - { id: acc-a, currency: USD }
  - { id: acc-h, currency: USD, tracking_mode: HOLDINGS }
activities:
  - { id: dep, account: acc-a, type: DEPOSIT, date: 2025-01-01T10:00:00Z, amount: 1000 }
  - { id: out, account: acc-a, type: TRANSFER_OUT, date: 2025-01-03T10:00:00Z, amount: 100, source_group_id: g }
  - { id: tin, account: acc-h, type: TRANSFER_IN, date: 2025-01-03T11:00:00Z, amount: 100, source_group_id: g }
observed_snapshots:
  - { account: acc-h, date: 2025-01-01, cash: { USD: 100 } }
  - { account: acc-h, date: 2025-01-03, cash: { USD: 150 } }
expected_notes: >
  acc-a: outflow 100 on 01-03. acc-h: inflow 50 on 01-03 (150 - 100,
  inferred). Portfolio flows: 01-03 outflow 50. Before the fix each side was
  netted on its own and floored at zero: no flow.
