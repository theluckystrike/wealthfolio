id: EDGE-DRIP-01
title: DRIP whose reinvestment leg is rejected keeps the dividend as cash
intent: >
  Rejection is atomic per event, not per stored activity. A DRIP paid in USD
  on a GBP-quoted asset, with no USD/GBP rate and no rate on the row, compiles
  into `drip-1:dividend` (books 20 USD) and `drip-1:buy` (needs the price in
  GBP). The buy leg cannot convert, so it is rejected and leaves no trace; the
  income leg stands. Valuation and attribution price every ledger event, so
  keeping the income as cash is what keeps them consistent: skipping both legs
  would leave attribution counting income the account never received.
policy:
  base_currency: USD
  timezone: UTC
  as_of: 2025-01-10
accounts:
  - id: acc-1
    name: Brokerage
    currency: USD
assets:
  - id: vod
    quote_ccy: GBP
activities:
  - id: dep-1
    account: acc-1
    type: DEPOSIT
    date: 2025-01-02T10:00:00Z
    amount: 1000
  - id: drip-1
    account: acc-1
    type: DIVIDEND
    subtype: DRIP
    date: 2025-01-08T10:00:00Z
    asset: vod
    quantity: 2
    unit_price: 10
    amount: 20
quotes:
  - { asset: vod, day: 2025-01-08, close: 8 }
  - { asset: vod, day: 2025-01-10, close: 8 }
expected_notes: >
  Cash USD 1000 from 01-02, 1020 from 01-08 (income leg). No vod position and
  no lot: the rejected buy leg leaves the account exactly as the income leg
  left it. An ActivityRejected error names `drip-1:buy` (USD to GBP
  conversion). net_contribution 1000 throughout, no flows. Attribution income
  20. Total value 1000 -> 1020 on 01-08.
